<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#0D2A2A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D9488"/>
      <stop offset="100%" stop-color="#0891B2"/>
    </linearGradient>
  </defs>

  <!-- Dark background -->
  <rect width="1200" height="630" rx="24" fill="url(#bg)"/>

  <!-- Subtle grid lines -->
  <line x1="0" y1="315" x2="1200" y2="315" stroke="#1E293B" stroke-width="1"/>
  <line x1="600" y1="0" x2="600" y2="630" stroke="#1E293B" stroke-width="1"/>

  <!-- Logo icon: large teal rounded square with lightning bolt -->
  <rect x="88" y="195" width="120" height="120" rx="28" fill="url(#accent)"/>
  <!-- Lightning bolt -->
  <path d="M148 218L116 258h28l-4 42L172 258h-28L148 218Z"
        fill="white" stroke="white" stroke-width="1" stroke-linejoin="round"/>

  <!-- Site name -->
  <text x="232" y="275" font-family="system-ui, -apple-system, sans-serif"
        font-size="72" font-weight="800" fill="white" letter-spacing="-2">Tech</text>
  <text x="376" y="275" font-family="system-ui, -apple-system, sans-serif"
        font-size="72" font-weight="800" fill="#2DD4BF" letter-spacing="-2">Tool</text>
  <text x="528" y="275" font-family="system-ui, -apple-system, sans-serif"
        font-size="72" font-weight="800" fill="white" letter-spacing="-2">Snap</text>

  <!-- Tagline -->
  <text x="232" y="320" font-family="system-ui, -apple-system, sans-serif"
        font-size="26" font-weight="400" fill="#94A3B8" letter-spacing="0">
    Free Online Tools · 100% In-Browser · Zero Uploads
  </text>

  <!-- Bottom badge pills -->
  <rect x="88" y="395" width="180" height="42" rx="21" fill="#0D9488" fill-opacity="0.2" stroke="#0D9488" stroke-width="1.5"/>
  <text x="178" y="421" font-family="system-ui" font-size="18" font-weight="700" fill="#2DD4BF" text-anchor="middle">⚡ Free Forever</text>

  <rect x="284" y="395" width="200" height="42" rx="21" fill="#0891B2" fill-opacity="0.2" stroke="#0891B2" stroke-width="1.5"/>
  <text x="384" y="421" font-family="system-ui" font-size="18" font-weight="700" fill="#67E8F9" text-anchor="middle">🔒 100% Private</text>

  <rect x="500" y="395" width="220" height="42" rx="21" fill="#6366F1" fill-opacity="0.2" stroke="#6366F1" stroke-width="1.5"/>
  <text x="610" y="421" font-family="system-ui" font-size="18" font-weight="700" fill="#A5B4FC" text-anchor="middle">✓ No Sign-up</text>
</svg>
